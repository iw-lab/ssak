# Firebase 웹 설정의 apiKey 는 브라우저에 그대로 실리는 공개 식별자라 비밀이 아니다(보호는 보안 규칙·도메인 제한).
# 빌드 결과물·gitignore 된 .env 만 경로로 빼고, 스크립트는 .gitleaksignore 지문으로 하나씩 뺀다.
# Gemini·Anthropic 같은 진짜 비밀 키는 여기에 넣지 않는다(2026-11-18: SECURITY_GUIDE.md 의 Gemini 키를 지움).
[extend]
useDefault = true

[allowlist]
description = "Firebase 웹 apiKey (공개 식별자)"
paths = ['''^dist/''', '''^\.env$''']
